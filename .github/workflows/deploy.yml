name: Build and publish

# Push sur main → image construite, vérifiée (manage.py check --deploy), puis publiée sur GHCR
# (tags « latest » et SHA du commit). Le serveur 192.168.11.134 la récupère tout seul
# (timer sites-update de sites-infra) : ni VPN, ni SSH, ni secret dans ce workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hug0003/site-crushbrito
  # Dossier qui contient manage.py et le Dockerfile.
  CONTEXT: osculte

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bloque la publication si la configuration de production n'est pas sûre
      # (DEBUG, cookies non sécurisés, HSTS absent, clé faible…) ou si une migration manque.
      - name: Django security checks
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
            -e DJANGO_ALLOWED_HOSTS=hugomeuriel.fr \
            -e DJANGO_DB_PATH=/tmp/check.sqlite3 \
            --entrypoint sh ${{ env.IMAGE }}:test -c \
            "python manage.py check --deploy --fail-level WARNING && python manage.py makemigrations --check --dry-run"

      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
